appId: com.hive.app
productName: Hive
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/**/*

# The CLIs (`resources/cli`) and MCP servers (`resources/mcp`) must be reachable
# by a plain `node` OUTSIDE Electron (the app injects paths like $HIVE_TICKET_CLI
# and agents shell out to them). Files inside app.asar can't be read that way, so
# copy them to Contents/Resources/cli/ and Contents/Resources/mcp/ (unpacked) →
# process.resourcesPath/{cli,mcp}/*.mjs at runtime. They are dependency-free (Node
# built-in WebSocket), so no node_modules ride along.
# NOTE: platform-specific extraResources REPLACE this top-level list, so `mac`
# repeats the cli+mcp entries below (win/linux have none, so they inherit this).
extraResources:
  - from: resources/cli
    to: cli
  - from: resources/mcp
    to: mcp

# Native .node binaries cannot be loaded from inside an ASAR archive.
# This extracts them to app.asar.unpacked/ at build time.
asarUnpack:
  - '**/*.node'
  - '**/better-sqlite3/**'
  - '**/node-pty/**'

# ── macOS ──────────────────────────────────────────────
mac:
  icon: resources/icon.icns
  extraResources:
    - from: src/native/build/Release/ghostty.node
      to: native/ghostty.node
    - from: resources/cli
      to: cli
    - from: resources/mcp
      to: mcp
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  notarize: true

dmg:
  sign: false

# ── Windows ────────────────────────────────────────────
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: "Hive-Setup-${version}.${ext}"

# ── Linux ──────────────────────────────────────────────
linux:
  icon: resources/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1

# ── Auto-update ───────────────────────────────────────
publish:
  - provider: github
    owner: morapelker
    repo: hive
